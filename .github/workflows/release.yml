name: NexVora Motion Studio APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

env:
  NDK_VERSION: 29.0.14206865
  CARGO_INCREMENTAL: 0
  GGML_NATIVE: "OFF"

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-24.04
    timeout-minutes: 120

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Install system libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake libclang-dev

      - name: Install Rust
        working-directory: src
        run: |
          rustup toolchain install
          rustup target add aarch64-linux-android

      - name: Install Android NDK and cargo-ndk
        run: |
          cargo install cargo-ndk --version 4.1.2 --locked
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;$NDK_VERSION"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/$NDK_VERSION" >> "$GITHUB_ENV"

      - name: Build FFmpeg
        run: src/scripts/ffmpeg-mobile.sh aarch64-linux-android

      - name: Build sherpa-onnx
        run: src/scripts/sherpa-mobile.sh aarch64-linux-android

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src

      - name: Build APK
        run: |
          cd src
          eval "$(scripts/mobile-env.sh aarch64-linux-android)"
          cd crates/capcraft-android/android
          chmod +x gradlew
          ./gradlew assembleDebug "-Pcapcraft.abis=arm64-v8a" --no-daemon
          mkdir -p "$GITHUB_WORKSPACE/dist"
          cp app/build/outputs/apk/debug/app-debug.apk "$GITHUB_WORKSPACE/dist/NexVora-Motion-Studio.apk"

      - name: Verify APK
        run: |
          test -s dist/NexVora-Motion-Studio.apk
          unzip -t dist/NexVora-Motion-Studio.apk
          sha256sum dist/NexVora-Motion-Studio.apk

      - name: Publish direct APK release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "test-${GITHUB_RUN_NUMBER}" \
            dist/NexVora-Motion-Studio.apk \
            --title "NexVora Motion Studio Build ${GITHUB_RUN_NUMBER}" \
            --notes "Automatically built Android ARM64 debug APK."
