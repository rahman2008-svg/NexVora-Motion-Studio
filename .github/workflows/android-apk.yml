name: Android APK Build

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Build Android Debug APK
    runs-on: ubuntu-24.04
    timeout-minutes: 120

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake libclang-dev

      - name: Setup Rust
        working-directory: src
        run: |
          rustup toolchain install
          rustup target add aarch64-linux-android

      - name: Setup Android NDK
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;29.0.14206865" || true
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/29.0.14206865" >> "$GITHUB_ENV"

      - name: Install cargo-ndk
        run: cargo install cargo-ndk --version 4.1.2 --locked

      - name: Build FFmpeg
        run: src/scripts/ffmpeg-mobile.sh aarch64-linux-android

      - name: Build sherpa-onnx
        run: src/scripts/sherpa-mobile.sh aarch64-linux-android

      - name: Build APK
        run: |
          cd src
          eval "$(scripts/mobile-env.sh aarch64-linux-android)"
          cd crates/capcraft-android/android
          chmod +x gradlew
          ./gradlew assembleDebug \
            "-Pcapcraft.abis=arm64-v8a" \
            --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: NexVora-Motion-Studio-APK
          path: src/crates/capcraft-android/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
